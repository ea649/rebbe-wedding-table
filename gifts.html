<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תיבת המתנות לרבי ולרבנית</title>
<meta name="description" content="התוועדות החתונה · שולחן מנהלות שלהבות חב״ד — מה המתנה שלך לרבי ולרבנית?">
<meta property="og:title" content="תיבת המתנות לרבי ולרבנית">
<meta property="og:image" content="https://ea649.github.io/rebbe-wedding-table/images/gifts/box.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { background: radial-gradient(ellipse at 50% 30%, #5a1824 0%, #2b0a11 55%, #16050a 100%); background-attachment: fixed; color: #f4ead7; }
  .top { text-align: center; padding: 26px 16px 0; position: relative; }
  .top .bh { color: #cdb98f; top: 18px; right: 22px; }
  .logo-pill { display: inline-block; background: var(--paper); padding: 10px 22px; border-radius: 99px; box-shadow: 0 0 0 1px var(--gold), 0 10px 30px -10px rgba(0,0,0,.6); }
  .logo-pill img { height: 46px; display: block; }
  .top h1 { font-size: clamp(36px, 8vw, 64px); color: var(--gold-light); margin-top: 18px; text-shadow: 0 2px 20px rgba(226,199,136,.25); }
  .top .sub { color: #e6d6b8; font-size: clamp(16px, 3.6vw, 21px); margin: 6px auto 0; max-width: 620px; }
  .mini-portraits { display: flex; justify-content: center; gap: 14px; margin: 18px 0 0; }
  .mini-portraits .arch { width: 74px; }
  .stage-wrap { width: min(760px, calc(100% - 24px)); margin: 0 auto; }
  .stage { position: relative; width: 100%; aspect-ratio: 1 / 1.08; }
  .chest { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 1; pointer-events: none; filter: drop-shadow(0 30px 30px rgba(0,0,0,.5)); }
  .chest.front { z-index: 3; clip-path: inset(52.5% 0 0 0); filter: none; }
  .pile { position: absolute; left: 17%; right: 17%; top: 0; bottom: 25%; z-index: 2; }
  .gift { position: absolute; transform-origin: 50% 80%; filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); transition: left .6s, bottom .6s, width .6s; }
  .gift img { width: 100%; display: block; }
  .gift.new { animation: drop 1.1s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes drop { 0% { transform: translateY(-120vh) rotate(var(--r)) scale(1.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateY(0) rotate(var(--r)) scale(1); } }
  .count { text-align: center; font-family: var(--head); color: var(--gold-light); font-size: clamp(22px, 4.5vw, 32px); margin: 10px 0 0; }
  .count small { display: block; font-family: var(--body); color: #cdb98f; font-size: 15px; }
  .card { background: var(--paper); color: var(--ink); width: min(520px, calc(100% - 32px)); margin: 26px auto 18px; padding: 30px 26px 24px; position: relative; text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
  .card::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--gold); pointer-events: none; }
  .card h2 { font-size: 30px; color: var(--burgundy); }
  .card .lead { color: var(--muted); margin: 6px 0 8px; font-size: 16px; }
  .result img { width: 150px; filter: drop-shadow(0 8px 12px rgba(0,0,0,.3)); }
  .closed { text-align: center; color: #e6d6b8; padding: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 90px)); visibility: hidden; width: min(640px, calc(100% - 24px)); background: var(--paper); color: var(--ink); display: flex; gap: 16px; align-items: center; padding: 14px 18px; box-shadow: 0 0 0 1px var(--gold), 0 20px 40px -10px rgba(0,0,0,.7); transition: transform .5s cubic-bezier(.2,.9,.3,1.1), visibility .5s; z-index: 900; text-align: right; }
  .toast.show { transform: translate(-50%, 0); visibility: visible; }
  .toast img { width: 74px; flex: none; }
  .toast b { font-family: var(--head); color: var(--burgundy); font-size: 22px; display: block; }
  .toast span { font-size: 17px; }
  footer { color: #b5a07a; }

  /* מסך גדול */
  body.screen { height: 100vh; overflow: hidden; }
  body.screen .card, body.screen footer, body.screen .mini-portraits { display: none; }
  body.screen .layout { display: grid; grid-template-columns: 1fr minmax(0, 62vh) 1fr; align-items: center; height: calc(100vh - 210px); }
  body.screen .stage-wrap { width: 100%; }
  body.screen .side { padding: 0 3vw; }
  body.screen .toast { width: min(900px, 80vw); bottom: 40px; padding: 20px 26px; }
  body.screen .toast img { width: 110px; } body.screen .toast b { font-size: 34px; } body.screen .toast span { font-size: 26px; }
  .qr { background: #fff; padding: 14px; display: inline-block; box-shadow: 0 0 0 2px var(--gold); }
  .qr-cap { color: var(--gold-light); font-family: var(--head); font-size: 26px; margin-top: 12px; text-align: center; }
  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { border-bottom: 1px solid rgba(226,199,136,.25); padding: 10px 0; font-size: 19px; color: #f4ead7; }
  .recent li b { color: var(--gold-light); font-weight: 700; display: block; font-size: 16px; }
  body:not(.screen) .side { display: none; }
</style>
</head>
<body>
<header class="top">
  <span class="bh">ב״ה</span>
  <div class="logo-pill"><img src="images/logo-shalhevet.png" alt="שלהבות חב״ד"></div>
  <div class="mini-portraits">
    <div class="arch"><img src="images/rebbe.jpg" alt="הרבי ביום החתונה"></div>
    <div class="arch"><img src="images/rebbetzin.jpg" alt="הרבנית ביום החתונה"></div>
  </div>
  <h1>תיבת המתנות לרבי ולרבנית</h1>
  <div class="sub">התוועדות החתונה · י״ד כסליו · שולחן מנהלות שלהבות חב״ד</div>
</header>

<div class="layout">
  <aside class="side" id="qrSide">
    <div style="text-align:center"><div class="qr" id="qr"></div><div class="qr-cap">סרקי והכניסי<br>את המתנה שלך</div></div>
  </aside>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="pile" id="pile"></div>
      <img class="chest" src="images/gifts/box.png" alt="תיבת המתנות">
      <img class="chest front" src="images/gifts/box.png" alt="">
    </div>
    <div class="count" id="count"></div>
  </div>
  <aside class="side"><ul class="recent" id="recent"></ul></aside>
</div>

<section class="card" id="card">
  <form id="form" novalidate>
    <h2>חותמת על מתנה</h2>
    <div class="lead">משהו שעשיתי השנה בבית הספר שהרבי והרבנית ישמחו בו</div>
    <div class="field"><label for="fName">שם</label><input id="fName" maxlength="40" autocomplete="name"></div>
    <div class="field"><label for="fBranch">סניף</label><select id="fBranch"></select></div>
    <div class="field" id="otherWrap" hidden><label for="fOther">שם הסניף</label><input id="fOther" maxlength="30"></div>
    <div class="field"><label for="fGift">המתנה שלי לרבי ולרבנית</label><textarea id="fGift" maxlength="300" placeholder="למשל: חיזוק הפרדה, השתדלות מיוחדת בנושא כיפה, מעשה לחיזוק הצוות, פעולה פדגוגית בדרך להצלחה..."></textarea></div>
    <button class="btn" id="submit">להכניס לתיבה 🎁</button>
    <div class="err" id="err"></div>
  </form>
  <div id="done" class="result" hidden>
    <img id="doneImg" alt="">
    <h2>המתנה שלך בתיבה!</h2>
    <p id="doneTxt"></p>
    <button class="btn" type="button" id="again">להוסיף עוד מתנה</button>
  </div>
</section>
<footer>שלהבות חב״ד · רשת חינוך חב״ד</footer>

<div class="toast" id="toast" aria-live="polite"><img id="tImg" alt=""><div><b id="tName"></b><span id="tGift"></span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { getState, post, store, esc, fillBranches, CAT_NAMES } from './app.js';
const $ = (id) => document.getElementById(id);
const screen = new URLSearchParams(location.search).has('screen');
if (screen) document.body.classList.add('screen');

fillBranches($('fBranch'));
$('fBranch').onchange = () => { $('otherWrap').hidden = $('fBranch').value !== 'אחר'; };
const me = store.get('me');
if (me) { $('fName').value = me.name || ''; if (me.branch) { $('fBranch').value = me.branch; } }

if (screen && window.qrcode) {
  const q = qrcode(0, 'M'); q.addData(location.href.split('?')[0]); q.make();
  $('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0 });
  $('qr').querySelector('svg').style.cssText = 'width:min(22vw,34vh);height:auto;display:block';
}

const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const img = (cat) => `images/gifts/${CAT_NAMES[cat] ? cat : 'general'}.png`;

// סידור המתנות כערימה (תל) בתוך התיבה
function layout(n, W, H) {
  let s = W / 3.2;
  const cap = (s) => { let c = 0; const base = Math.max(1, Math.floor(W / (s * .78))); for (let k = 0; base - Math.floor(k / 2) > 0 && k * s * .5 + s <= H * 1.1; k++) c += base - Math.floor(k / 2); return c; };
  while (cap(s) < n && s > 22) s *= .93;
  const pos = []; const base = Math.max(1, Math.floor(W / (s * .78)));
  for (let k = 0, i = 0; i < n; k++) {
    const row = Math.max(1, base - Math.floor(k / 2));
    for (let j = 0; j < row && i < n; j++, i++) {
      const x = W / 2 + (j - (row - 1) / 2) * s * .78 - s / 2;
      pos.push({ x: x + (k % 2 ? s * .39 : 0) * (row < base - Math.floor(k / 2) + 1 ? 0 : 0), y: k * s * .5, s });
    }
  }
  return pos;
}

let shown = new Set(), first = true, state = null;
function render() {
  const gifts = state.gifts || [];
  const pile = $('pile');
  const W = pile.clientWidth, H = pile.clientHeight;
  const pos = layout(gifts.length, W, H);
  const fresh = [];
  gifts.forEach((g, i) => {
    let el = pile.querySelector(`[data-id="${g.id}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'gift'; el.dataset.id = g.id;
      const r = (hash(g.id) % 36) - 18;
      el.style.setProperty('--r', r + 'deg'); el.style.transform = `rotate(${r}deg)`;
      el.innerHTML = `<img src="${img(g.cat)}" alt="${esc(CAT_NAMES[g.cat] || 'מתנה')}">`;
      el.title = `${g.name}${g.branch ? ' · ' + g.branch : ''}: ${g.gift}`;
      pile.appendChild(el);
      if (!first) { el.classList.add('new'); fresh.push(g); }
    }
    const p = pos[i]; const jx = (hash(g.id + 'x') % 20 - 10) / 100 * p.s;
    el.style.width = p.s + 'px'; el.style.left = p.x + jx + 'px'; el.style.bottom = p.y + 'px'; el.style.zIndex = 10 + i;
  });
  pile.querySelectorAll('.gift').forEach((el) => { if (!gifts.find((g) => g.id === el.dataset.id)) el.remove(); });
  $('count').innerHTML = gifts.length ? `${gifts.length} מתנות בתיבה <small>ועוד ועוד מתנות בדרך...</small>` : 'התיבה מחכה למתנה הראשונה <small>סרקי, כתבי — והמתנה תיכנס לתיבה</small>';
  $('recent').innerHTML = gifts.slice(-6).reverse().map((g) => `<li><b>${esc(g.name)}${g.branch ? ' · ' + esc(g.branch) : ''}</b>${esc(g.gift)}</li>`).join('');
  if (state.giftsOpen === false && !screen) { $('card').innerHTML = '<div class="closed" style="color:var(--ink)"><h2>תיבת המתנות נסגרה</h2><p>תודה לכל המנהלות! ✦</p></div>'; }
  fresh.forEach((g, i) => setTimeout(() => toast(g), i * 6500));
  first = false;
}

let toastT;
function toast(g) {
  $('tImg').src = img(g.cat); $('tName').textContent = g.name + (g.branch ? ' · ' + g.branch : '');
  $('tGift').textContent = g.gift;
  $('toast').classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('show'), 6000);
}

let busy = false;
$('form').onsubmit = async (e) => {
  e.preventDefault(); if (busy) return;
  const name = $('fName').value.trim();
  const branch = $('fBranch').value === 'אחר' ? ($('fOther').value.trim() || 'אחר') : $('fBranch').value;
  const gift = $('fGift').value.trim();
  if (name.length < 2) return ($('err').textContent = 'נא למלא שם');
  if (gift.length < 3) return ($('err').textContent = 'נא לכתוב מה המתנה');
  busy = true; $('submit').disabled = true; $('err').textContent = '';
  try {
    const r = await post('/api/gift', { name, branch, gift });
    if (r.ok) {
      store.set('me', { name, branch });
      $('doneImg').src = img(r.gift.cat); $('doneImg').alt = CAT_NAMES[r.gift.cat] || 'מתנה';
      $('doneTxt').textContent = '"' + gift + '"';
      $('form').hidden = true; $('done').hidden = false;
      state = { ...r.state }; render();
      $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else $('err').textContent = r.error || 'משהו השתבש, נסי שוב';
  } catch { $('err').textContent = 'אין כרגע חיבור — נסי שוב בעוד רגע'; }
  busy = false; $('submit').disabled = false;
};
$('again').onclick = () => { $('fGift').value = ''; $('form').hidden = false; $('done').hidden = true; $('fGift').focus(); };

async function refresh() { state = await getState(); render(); }
await refresh();
setInterval(refresh, screen ? 3000 : 6000);
addEventListener('resize', () => state && render());
</script>
</body>
</html>
