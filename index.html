<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save the Date · שולחן מנהלות שלהבות חב״ד</title>
<meta name="description" content="שולחן מנהלות שלהבות חב״ד שמור לכן בהתוועדות החתונה — יום שלישי י״ד כסליו 24.11, 12:00–13:30. בחרי את הכיסא שלך.">
<meta property="og:title" content="Save the Date · שולחן מנהלות שלהבות חב״ד">
<meta property="og:description" content="התוועדות החתונה · יום שלישי י״ד כסליו 24.11 · 12:00–13:30 · לאישור הגעה ובחירת כיסא">
<meta property="og:image" content="https://ea649.github.io/rebbe-wedding-table/images/save-the-date.jpg">
<meta name="theme-color" content="#f5f0e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #1a0f0c; }
  /* ===== פתיחה: נייר ההזמנה ===== */
  .paper { position: relative; max-width: 560px; margin: 0 auto; padding: 46px 26px 34px; text-align: center; background: var(--paper);
    background-image: radial-gradient(ellipse at 50% 0%, #fff 0%, transparent 60%); }
  .paper::before { content: ''; position: absolute; inset: 12px; border: 1px solid rgba(110,20,36,.35); pointer-events: none; }
  .paper .bh { position: absolute; top: 22px; right: 26px; font-size: 12px; color: var(--muted); }
  .paper .logo { width: 150px; display: block; margin: 0 auto 22px; }
  .save { font-family: var(--script); color: var(--purple); font-size: clamp(52px, 15vw, 76px); line-height: 1; }
  .intro { font-size: 18px; line-height: 1.45; margin-top: 14px; }
  .intro b { font-weight: 700; }
  .names { position: relative; font-family: var(--head); color: var(--purple); font-size: clamp(64px, 19vw, 96px); line-height: .98; margin: 16px 0 6px; }
  .names .amp { position: absolute; inset: -10% 0; display: grid; place-items: center; font-family: var(--body); font-weight: 300; font-size: 2.2em; color: rgba(110,20,36,.09); line-height: 1; }
  .names span { position: relative; display: block; }
  .portraits { display: flex; justify-content: center; gap: 16px; margin: 18px 0 8px; }
  .portraits .arch { width: 74px; outline-color: rgba(110,20,36,.5); outline-offset: 4px; }
  .years { font-size: 14px; letter-spacing: .12em; color: var(--muted); margin-top: 10px; }
  .when { display: grid; grid-template-columns: 1fr 1.15fr 1fr; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 26px 0 0; }
  .when div { padding: 12px 4px; font-size: 15.5px; line-height: 1.4; display: flex; flex-direction: column; justify-content: center; }
  .when div + div { border-right: 1px solid var(--ink); }
  .when b { font-family: var(--head); font-weight: 400; font-size: 21px; color: var(--purple); display: block; }
  .topics { margin-top: 18px; font-size: 16px; line-height: 1.5; }
  .topics small { display: block; color: var(--muted); font-size: 14.5px; margin-top: 4px; }
  .go { display: inline-block; margin-top: 24px; text-decoration: none; background: var(--bordeaux-grad); color: #fff; padding: 13px 30px; font-size: 18px; letter-spacing: .04em; box-shadow: 0 12px 26px -12px rgba(110,20,36,.8); }
  .go span { font-family: var(--script); font-size: 26px; margin-left: 8px; vertical-align: -3px; }

  /* ===== האולם ===== */
  .hall { background: #1a0f0c; color: #f3e8d6; padding: 34px 0 30px; }
  .hall-head { position: relative; text-align: center; padding: 0 20px 18px; }
  .hall-head .bh { position: absolute; top: -18px; right: 16px; font-size: 12px; color: #9c8b72; }
  .hall-head .sub { font-size: 16px; color: #e6d6b8; margin-top: 8px; }
  .hall-head .std-script { font-family: var(--script); color: var(--gold-soft); font-size: clamp(54px, 15vw, 84px); line-height: 1.05; margin: 4px auto 8px; }
  .hall-head .date { font-family: var(--head); font-size: clamp(24px, 6.6vw, 32px); letter-spacing: .08em; word-spacing: .15em; color: var(--gold-soft); margin-top: 12px; line-height: 1.3; }
  .counter[hidden] { display: none; }
  .hall-head .script { font-family: var(--script); color: var(--gold-soft); font-size: 40px; line-height: 1; }
  .hall-head h2 { font-family: var(--head); font-size: clamp(34px, 9vw, 54px); color: #fff; margin-top: 6px; }
  .hall-head p { color: #cdbca2; margin: 8px auto 0; max-width: 520px; font-size: 16px; }
  .counter { margin-top: 14px; }
  .hall-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
  .hall-scroll::-webkit-scrollbar { display: none; }
  .hall-stage { min-width: 980px; background-image: url('images/hall-table-v5.jpg'); }
  /* מספר רקום על המפית */
  .nap { position: absolute; transform: translate(-50%, -50%); z-index: 3; border: 0; background: none; padding: 0; cursor: pointer; width: 6.5%; aspect-ratio: 1.4; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; container-type: inline-size; }
  .nap .num { font-family: var(--head); font-size: var(--fs); line-height: 1; transform: scaleY(.72);
    background: repeating-linear-gradient(115deg, #fff1c4 0 .6px, #e3c27a .6px 1.5px, #a9823a 1.5px 2.2px); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .6px 0 rgba(40,8,14,.9)) drop-shadow(0 0 1.5px rgba(255,220,150,.35)); transition: transform .2s; }
  .nap:hover .num, .nap:focus-visible .num { transform: scaleY(.72) scale(1.15); }
  .nap:focus-visible { outline: none; }
  .nap.taken { cursor: default; }
  .nap.taken .num { opacity: 0; }
  /* כרטיס Reserved for מקופל (בסיס מאינדיזיין) */
  .tent { position: absolute; z-index: 4; width: 8.6%; aspect-ratio: 1200 / 800; transform: translate(-50%, -78%); pointer-events: none; container-type: inline-size;
    background: url('images/place-card-base.png') center / 100% 100% no-repeat; animation: stand .6s cubic-bezier(.2,.9,.3,1.3) both; }
  .tent .b { position: absolute; left: 13%; right: 13%; top: 42.4%; text-align: center; font-family: var(--body); font-size: 3.1cqw; color: #766c64; white-space: nowrap; line-height: 1.2; letter-spacing: .02em; }
  .tent .n { position: absolute; left: 11%; right: 11%; top: 51.5%; height: 23.5%; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-size: 12cqw; color: #1e1714; white-space: nowrap; line-height: 1; }
  .tent.mine { filter: drop-shadow(0 0 6px rgba(255,236,190,.95)); }
  @keyframes stand { from { transform: translate(-50%, -40%) scale(.4); opacity: 0; } to { transform: translate(-50%, -78%) scale(1); opacity: 1; } }
  /* נייד: כל השולחן ברוחב המסך, בלי גלילה */
  @media (max-width: 820px) {
    .hall-scroll { overflow: hidden; }
    .hall-crop { position: relative; width: 100%; aspect-ratio: 1180 / 600; overflow: hidden; container-type: inline-size; }
    .hall-stage { position: absolute; min-width: 0; max-width: none; width: 130.17cqw; left: -15.25cqw; top: -16.95cqw; }
    .tent { width: 12.5%; }
    .hall-head h2 { font-size: 36px; }
    .hall-head p { font-size: 15px; }
  }

  /* חלון */
  .dialog .script { color: var(--purple); }
  .dialog h3 { font-size: clamp(24px, 6.6vw, 32px); white-space: nowrap; }
  .btn { background: var(--bordeaux-grad); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  .btn:hover { background: var(--bordeaux-grad-dark); }
  .ok-seal { background: radial-gradient(circle at 35% 30%, #a02a3a, var(--purple) 60%, #3a0812); color: #fff; box-shadow: 0 8px 18px -6px rgba(110,20,36,.7), inset 0 0 0 2px rgba(255,255,255,.6); }
  footer { background: #1a0f0c; color: #9c8b72; }
  footer img { display: none; }
</style>
</head>
<body>

<section class="hall" id="hall">
  <div class="hall-head">
    <span class="bh">ב״ה</span>
    <div class="std-script" dir="ltr">Save the Date</div>
    <h2>בחרי את הכיסא שלך</h2>
    <div class="date">יום שלישי · י״ד כסליו · 24.11<br><span dir="ltr">12:00–13:30</span></div>
    <div class="counter" id="counter" hidden></div>
    <div class="banner" id="banner"></div>
  </div>
  <div class="hall-scroll" id="hallScroll"><div class="hall-crop"><div class="hall-stage" id="stage"></div></div></div>
</section>

<footer>שלהבות חב״ד · רשת חינוך חב״ד</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dialog"><div class="in">
    <button class="close" type="button" aria-label="סגירה" data-close>×</button>
    <form id="form" novalidate>
      <div class="script">Reserved</div>
      <h3 id="dlgTitle">שולחן מנהלות שלהבות חב״ד</h3>
      <div class="field"><label for="fName">השם שלך</label><input id="fName" autocomplete="name" maxlength="40"></div>
      <div class="field"><label for="fBranch">סניף</label><select id="fBranch"></select></div>
      <div class="field" id="otherWrap" hidden><label for="fOther">שם הסניף</label><input id="fOther" maxlength="30"></div>
      <div class="field"><label for="fPhone">נייד — לשם יישלח אישור ההגעה בוואטסאפ</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="050-0000000"></div>
      <button class="btn" id="submit">אישור הגעה</button>
      <div class="err" id="err"></div>
    </form>
    <div id="done" hidden>
      <div class="ok-seal">✓</div>
      <div class="script">See you there</div>
      <h3>מקומך שמור!</h3>
      <p>השם שלך כבר עומד על המפית.<br>אישור הגעה עם כל הפרטים — ומה להכין לצ'ק — נשלח אלייך עכשיו לוואטסאפ.</p>
      <button class="btn" type="button" data-close>לראות את השולחן</button>
    </div>
  </div></div>
</div>

<script type="module">
import { getState, post, store, fillBranches } from './app.js';

// 18 המפיות בתמונת האולם (פיקסלים מתוך 1536×1024), עם כיוון השעון מלמעלה
const SEATS = [[657,289],[800,281],[948,293],[1067,319],[1168,358],[1237,412],[1267,482],[1240,552],[1158,625],[990,686],[785,707],[575,685],[420,627],[318,552],[297,478],[330,406],[418,348],[520,312]];

const $ = (id) => document.getElementById(id);
const stage = $('stage'), modal = $('modal'), form = $('form');
let state = null, chosen = null, busy = false;
const mine = () => store.get('mySeat');
const pct = (x, y) => `left:${x / 1536 * 100}%;top:${y / 1024 * 100}%`;

fillBranches($('fBranch'));
$('fBranch').onchange = () => { $('otherWrap').hidden = $('fBranch').value !== 'אחר'; };

SEATS.forEach(([x, y], i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'nap'; b.dataset.seat = i + 1;
  b.style.cssText = pct(x, y) + `;--fs:${(36 + (y - 280) / 430 * 20).toFixed(1)}cqw`;
  b.innerHTML = `<span class="num">${i + 1}</span>`;
  b.setAttribute('aria-label', `מקום ${i + 1} — פנוי, לחצי לשמירה`);
  b.onclick = () => openForm(i + 1);
  stage.appendChild(b);
});

function render() {
  stage.querySelectorAll('.nap').forEach((b) => b.classList.toggle('taken', !!state.taken[b.dataset.seat]));
  const want = new Set(Object.keys(state.taken));
  stage.querySelectorAll('.tent').forEach((t) => { if (!want.has(t.dataset.seat)) t.remove(); });
  for (const n of want) {
    const t = state.taken[n]; if (!SEATS[n - 1]) continue;
    let el = stage.querySelector(`.tent[data-seat="${n}"]`);
    if (!el) {
      const [x, y] = SEATS[n - 1];
      el = document.createElement('div'); el.className = 'tent'; el.dataset.seat = n; el.style.cssText = pct(x, y) + `;z-index:${Math.round(y)}`;
      el.innerHTML = '<div class="b"></div><div class="n"></div>';
      stage.appendChild(el);
    }
    el.querySelector('.n').textContent = t.name;
    el.querySelector('.b').textContent = 'שלהבות חב״ד' + (t.branch ? ' · ' + t.branch : '');
    fitName(el.querySelector('.n'));
    el.classList.toggle('mine', mine() == n);
  }
  const total = SEATS.length, c = want.size;
  $('counter').textContent = c === 0 ? `${total} כיסאות מחכים לכן` : `${c} מתוך ${total} כיסאות נשמרו`;
  const bn = $('banner');
  if (!state.live) { bn.textContent = 'החיבור למערכת מתחדש — אפשר לנסות לשמור כיסא בעוד דקה.'; bn.classList.add('show'); }
  else if (state.reservationsOpen === false) { bn.textContent = 'שמירת המקומות נסגרה. נתראה בהתוועדות!'; bn.classList.add('show'); }
  else bn.classList.remove('show');
}

function fitName(n) { n.style.fontSize = ''; let f = 12; while (n.scrollWidth > n.clientWidth + 1 && f > 5) { f -= .5; n.style.fontSize = f + 'cqw'; } }

function openForm(n) {
  if (state.taken[n] || state.reservationsOpen === false) return;
  if (mine() && state.taken[mine()]) { alert('כבר שמרת מקום ליד השולחן 🙂'); return; }
  chosen = n; $('err').textContent = ''; form.hidden = false; $('done').hidden = true;
  modal.classList.add('open');
  setTimeout(() => $('fName').focus(), 50);
}
const closeModal = () => modal.classList.remove('open');
modal.addEventListener('click', (e) => { if (e.target === modal || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

form.onsubmit = async (e) => {
  e.preventDefault(); if (busy) return;
  const name = $('fName').value.trim();
  const branch = $('fBranch').value === 'אחר' ? ($('fOther').value.trim() || 'אחר') : $('fBranch').value;
  const phone = $('fPhone').value.replace(/\D/g, '');
  if (name.length < 2) return ($('err').textContent = 'נא למלא שם');
  if (!/^(05\d{8}|9725\d{8})$/.test(phone)) return ($('err').textContent = 'נא למלא מספר נייד תקין, למשל 050-1234567');
  busy = true; $('submit').disabled = true; $('submit').textContent = 'שומרת...';
  try {
    const r = await post('/api/reserve', { seat: chosen, name, branch, phone });
    if (r.ok) {
      store.set('mySeat', r.seat);
      state = { ...r.state, live: true }; render();
      form.hidden = true; $('done').hidden = false;
    } else {
      $('err').textContent = (r.error || 'משהו השתבש, נסי שוב').replace(/את כיסא \d+/, 'מקום ליד השולחן');
      if (r.seat) store.set('mySeat', r.seat);
      if (r.state) { state = { ...r.state, live: true }; render(); }
    }
  } catch { $('err').textContent = 'אין כרגע חיבור למערכת — נסי שוב בעוד דקה'; }
  busy = false; $('submit').disabled = false; $('submit').textContent = 'אישור הגעה';
};

// בטלפון: ממרכזים את השולחן בגלילה
const sc = $('hallScroll');
const centerHall = () => { const m = sc.scrollWidth - sc.clientWidth; if (m <= 0) return; sc.scrollLeft = -m / 2; if (sc.scrollLeft === 0) sc.scrollLeft = m / 2; };
addEventListener('load', centerHall);

async function refresh() { state = await getState(); render(); }
await refresh(); centerHall();
setInterval(() => { if (!modal.classList.contains('open')) refresh(); }, 5000);
</script>
</body>
</html>
